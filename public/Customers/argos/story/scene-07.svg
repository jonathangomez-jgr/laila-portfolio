<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="finalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sunriseGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="platformGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="heroGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardFinal">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark cosmic background -->
  <rect width="800" height="500" fill="url(#finalBg)"/>

  <!-- Stars -->
  <g fill="white" filter="url(#starGlow)">
    <circle cx="50" cy="30" r="1.5" opacity="0.9"/><circle cx="130" cy="55" r="1"/><circle cx="220" cy="20" r="1.8"/>
    <circle cx="310" cy="45" r="1.2"/><circle cx="500" cy="25" r="1.6"/><circle cx="600" cy="50" r="1"/>
    <circle cx="720" cy="30" r="1.4"/><circle cx="770" cy="60" r="0.8"/><circle cx="80" cy="80" r="1"/>
    <circle cx="180" cy="90" r="1.3"/><circle cx="430" cy="70" r="1.1"/><circle cx="680" cy="85" r="1.5"/>
    <circle cx="350" cy="30" r="0.9"/><circle cx="555" cy="65" r="1.2"/><circle cx="650" cy="20" r="0.8"/>
  </g>

  <!-- Sunrise glow on horizon -->
  <ellipse cx="400" cy="340" rx="380" ry="80" fill="url(#horizonGlow)" opacity="0.6"/>
  <ellipse cx="400" cy="340" rx="200" ry="40" fill="#3b82f6" opacity="0.2"/>

  <!-- Sun rising -->
  <circle cx="400" cy="340" r="55" fill="url(#sunriseGrad)" filter="url(#heroGlow)" opacity="0.85"/>
  <circle cx="400" cy="340" r="38" fill="#fef9c3" opacity="0.6"/>
  <circle cx="400" cy="340" r="22" fill="white" opacity="0.7"/>

  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-width="2" opacity="0.5" filter="url(#starGlow)">
    <line x1="400" y1="278" x2="400" y2="262"/>
    <line x1="440" y1="290" x2="452" y2="278"/>
    <line x1="455" y1="330" x2="470" y2="328"/>
    <line x1="440" y1="370" x2="452" y2="382"/>
    <line x1="360" y1="290" x2="348" y2="278"/>
    <line x1="345" y1="330" x2="330" y2="328"/>
    <line x1="360" y1="370" x2="348" y2="382"/>
  </g>

  <!-- Center glow halo -->
  <ellipse cx="400" cy="300" rx="250" ry="200" fill="url(#centerGlow)"/>

  <!-- Horizon / ground line -->
  <rect x="0" y="335" width="800" height="165" fill="#0f172a" opacity="0.7"/>
  <rect x="0" y="334" width="800" height="3" fill="#3b82f6" opacity="0.5"/>

  <!-- City silhouette (future) - clean, modern -->
  <g fill="#0f172a">
    <rect x="0" y="260" width="70" height="240"/>
    <rect x="65" y="280" width="50" height="220"/>
    <rect x="110" y="250" width="45" height="250"/>
    <rect x="580" y="270" width="45" height="230"/>
    <rect x="620" y="255" width="60" height="245"/>
    <rect x="675" y="280" width="55" height="220"/>
    <rect x="725" y="265" width="75" height="235"/>
  </g>
  <!-- Building windows glowing -->
  <g fill="#60a5fa" opacity="0.6">
    <rect x="15" y="270" width="6" height="4" rx="1"/><rect x="28" y="275" width="6" height="4" rx="1"/>
    <rect x="15" y="290" width="6" height="4" rx="1"/><rect x="28" y="290" width="6" height="4" rx="1"/>
    <rect x="120" y="260" width="7" height="4" rx="1"/><rect x="135" y="268" width="7" height="4" rx="1"/>
    <rect x="590" y="282" width="7" height="4" rx="1"/><rect x="632" y="265" width="8" height="5" rx="1"/>
    <rect x="684" y="290" width="6" height="4" rx="1"/><rect x="736" y="278" width="8" height="5" rx="1"/>
  </g>
  <!-- Argos building (tallest, center-left) with glowing logo -->
  <rect x="155" y="200" width="85" height="300" fill="#0f172a"/>
  <rect x="158" y="203" width="79" height="297" fill="#111827" opacity="0.8"/>
  <rect x="163" y="220" width="69" height="14" fill="#dc2626" opacity="0.7"/>
  <text x="197" y="231" text-anchor="middle" fill="#fee2e2" font-family="Arial" font-size="8" font-weight="bold" letter-spacing="2">ARGOS</text>
  <!-- Lit windows -->
  <g fill="#93c5fd" opacity="0.5">
    <rect x="165" y="242" width="10" height="8" rx="1"/><rect x="180" y="242" width="10" height="8" rx="1"/>
    <rect x="195" y="242" width="10" height="8" rx="1"/><rect x="210" y="242" width="10" height="8" rx="1"/>
    <rect x="165" y="258" width="10" height="8" rx="1"/><rect x="180" y="258" width="10" height="8" rx="1"/>
    <rect x="195" y="258" width="10" height="8" rx="1"/><rect x="210" y="258" width="10" height="8" rx="1"/>
    <rect x="165" y="274" width="10" height="8" rx="1"/><rect x="195" y="274" width="10" height="8" rx="1"/>
  </g>

  <!-- Platform floating hub - center top -->
  <rect x="280" y="55" width="240" height="130" rx="20" fill="url(#platformGrad)" filter="url(#cardFinal)" opacity="0.95"/>
  <!-- Shine -->
  <ellipse cx="320" cy="85" rx="80" ry="45" fill="white" opacity="0.06" transform="rotate(-20, 320, 85)"/>
  <!-- Content -->
  <text x="400" y="85" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial" font-size="9" letter-spacing="3">SALESFORCE</text>
  <text x="400" y="108" text-anchor="middle" fill="white" font-family="Arial" font-size="19" font-weight="900" letter-spacing="1">Agentforce</text>
  <text x="400" y="125" text-anchor="middle" fill="#c4b5fd" font-family="Arial" font-size="11" font-weight="bold">Para Cementos Argos</text>
  <text x="400" y="142" text-anchor="middle" fill="#a5b4fc" font-family="Arial" font-size="9">Market Share · Segmentación · Integración</text>
  <text x="400" y="160" text-anchor="middle" fill="#818cf8" font-family="Arial" font-size="9">3 Pilares · 20 Iniciativas · Mayo 2026</text>

  <!-- Connecting lines from platform to 3 pillars below -->
  <line x1="340" y1="185" x2="200" y2="310" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="400" y1="185" x2="400" y2="310" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <line x1="460" y1="185" x2="600" y2="310" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Pilar 1 bubble -->
  <g transform="translate(135, 310)">
    <circle r="55" fill="#1e3a8a" opacity="0.9" filter="url(#cardFinal)"/>
    <circle r="55" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
    <text x="0" y="-18" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="8" font-weight="bold" letter-spacing="1">PILAR 1</text>
    <text x="0" y="-3" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">Market</text>
    <text x="0" y="13" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">Share</text>
    <text x="0" y="30" text-anchor="middle" fill="#4ade80" font-family="Arial" font-size="12" font-weight="900">+15%</text>
    <text x="0" y="44" text-anchor="middle" fill="#6ee7b7" font-family="Arial" font-size="8">meta SPRINT ✓</text>
  </g>

  <!-- Pilar 2 bubble -->
  <g transform="translate(400, 320)">
    <circle r="55" fill="#1e1b4b" opacity="0.9" filter="url(#cardFinal)"/>
    <circle r="55" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.6"/>
    <text x="0" y="-18" text-anchor="middle" fill="#c4b5fd" font-family="Arial" font-size="8" font-weight="bold" letter-spacing="1">PILAR 2</text>
    <text x="0" y="-3" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">Segmen-</text>
    <text x="0" y="13" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">tación</text>
    <text x="0" y="30" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="12" font-weight="900">6+ camps</text>
    <text x="0" y="44" text-anchor="middle" fill="#fde68a" font-family="Arial" font-size="8">Machine Sellers IA</text>
  </g>

  <!-- Pilar 3 bubble -->
  <g transform="translate(665, 310)">
    <circle r="55" fill="#0c1a2e" opacity="0.95" filter="url(#cardFinal)"/>
    <circle r="55" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
    <text x="0" y="-18" text-anchor="middle" fill="#7dd3fc" font-family="Arial" font-size="8" font-weight="bold" letter-spacing="1">PILAR 3</text>
    <text x="0" y="-3" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">Integra-</text>
    <text x="0" y="13" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">ción</text>
    <text x="0" y="30" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="11" font-weight="900">360° Real</text>
    <text x="0" y="44" text-anchor="middle" fill="#6ee7b7" font-family="Arial" font-size="8">SAP + Argos ONE</text>
  </g>

  <!-- Floating result badges -->
  <rect x="580" y="80" width="185" height="30" fill="#064e3b" rx="15" filter="url(#cardFinal)" opacity="0.95"/>
  <circle cx="600" cy="95" r="8" fill="#22c55e"/>
  <text x="600" y="99" text-anchor="middle" fill="white" font-family="Arial" font-size="9">✓</text>
  <text x="618" y="99" fill="#4ade80" font-family="Arial" font-size="10" font-weight="bold">SPRINT 4.0 — Meta cumplida</text>

  <rect x="580" y="120" width="185" height="30" fill="#1e1b4b" rx="15" opacity="0.95"/>
  <circle cx="600" cy="135" r="8" fill="#7c3aed"/>
  <text x="600" y="139" text-anchor="middle" fill="white" font-family="Arial" font-size="9">★</text>
  <text x="618" y="139" fill="#c4b5fd" font-family="Arial" font-size="10" font-weight="bold">NPS +8 pts — Promotores</text>

  <rect x="580" y="160" width="185" height="30" fill="#1e3a8a" rx="15" opacity="0.95"/>
  <circle cx="600" cy="175" r="8" fill="#3b82f6"/>
  <text x="600" y="179" text-anchor="middle" fill="white" font-family="Arial" font-size="9">↑</text>
  <text x="618" y="179" fill="#93c5fd" font-family="Arial" font-size="10" font-weight="bold">60%+ Oport. automáticas</text>

  <!-- Carlos figure small - ground level -->
  <g transform="translate(400, 400)">
    <circle cx="0" cy="-20" r="12" fill="#fcd34d"/>
    <ellipse cx="0" cy="-30" rx="14" ry="7" fill="#f59e0b"/>
    <rect x="-10" y="-8" width="20" height="28" fill="#dc2626" rx="4"/>
    <rect x="-9" y="18" width="8" height="18" fill="#1e40af" rx="3"/>
    <rect x="2" y="18" width="8" height="18" fill="#1e40af" rx="3"/>
    <!-- Arms raised in triumph -->
    <line x1="-10" y1="2" x2="-28" y2="-15" stroke="#fcd34d" stroke-width="5" stroke-linecap="round"/>
    <line x1="10" y1="2" x2="28" y2="-15" stroke="#fcd34d" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Tagline -->
  <text x="400" y="475" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="13" font-weight="bold" opacity="0.9">
    "Market Share. Segmentación. Integración. Tres pilares, una plataforma, un socio."
  </text>

  <!-- Bottom label -->
  <rect x="0" y="486" width="800" height="14" fill="#1e1b4b" opacity="0.8"/>
  <text x="400" y="496" text-anchor="middle" fill="#a78bfa" font-family="Arial" font-size="9" letter-spacing="2">SALESFORCE · CEMENTOS ARGOS · MAYO 2026</text>
</svg>
