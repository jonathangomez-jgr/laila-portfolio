<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sky / Background -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="80" cy="40" r="1.2"/><circle cx="200" cy="25" r="0.8"/><circle cx="350" cy="55" r="1.5"/>
    <circle cx="500" cy="20" r="1"/><circle cx="650" cy="45" r="1.3"/><circle cx="720" cy="30" r="0.9"/>
    <circle cx="140" cy="70" r="0.7"/><circle cx="420" cy="35" r="1.1"/><circle cx="580" cy="65" r="0.8"/>
  </g>

  <!-- Moon -->
  <circle cx="680" cy="55" r="28" fill="#fef9c3" opacity="0.9" filter="url(#glow)"/>
  <circle cx="693" cy="48" r="22" fill="#1e3a5f"/>

  <!-- City silhouette -->
  <g fill="#0f172a" opacity="0.8">
    <rect x="0" y="270" width="60" height="230"/>
    <rect x="55" y="300" width="40" height="200"/>
    <rect x="90" y="250" width="55" height="250"/>
    <rect x="700" y="260" width="50" height="240"/>
    <rect x="740" y="290" width="60" height="210"/>
    <rect x="640" y="310" width="65" height="190"/>
  </g>
  <!-- Building windows (lit) -->
  <g fill="#fbbf24" opacity="0.7">
    <rect x="10" y="285" width="6" height="5" rx="1"/><rect x="22" y="285" width="6" height="5" rx="1"/>
    <rect x="10" y="300" width="6" height="5" rx="1"/><rect x="22" y="306" width="6" height="5" rx="1"/>
    <rect x="97" y="265" width="7" height="5" rx="1"/><rect x="112" y="272" width="7" height="5" rx="1"/>
    <rect x="710" y="272" width="6" height="5" rx="1"/><rect x="724" y="280" width="6" height="5" rx="1"/>
    <rect x="648" y="325" width="8" height="5" rx="1"/><rect x="662" y="320" width="8" height="5" rx="1"/>
  </g>

  <!-- Ground / Street -->
  <rect x="0" y="390" width="800" height="110" fill="url(#floorGrad)"/>
  <!-- Street glow lines (wet pavement) -->
  <rect x="0" y="390" width="800" height="2" fill="#3b82f6" opacity="0.3"/>
  <ellipse cx="400" cy="392" rx="350" ry="8" fill="#1d4ed8" opacity="0.15"/>

  <!-- Ferretería building -->
  <rect x="180" y="200" width="440" height="200" fill="#1e293b" rx="4" filter="url(#softShadow)"/>
  <rect x="180" y="200" width="440" height="8" fill="#334155"/>
  <!-- Signage -->
  <rect x="220" y="215" width="360" height="55" fill="#0f172a" rx="6"/>
  <text x="400" y="238" text-anchor="middle" fill="#60a5fa" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="3">FERRETERÍA</text>
  <text x="400" y="258" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="2">EL MAESTRO</text>
  <!-- Neon border on sign -->
  <rect x="220" y="215" width="360" height="55" fill="none" stroke="#3b82f6" stroke-width="1.5" rx="6" opacity="0.7"/>

  <!-- Shop windows - bags of cement visible -->
  <rect x="200" y="290" width="90" height="100" fill="#0f172a" rx="4" stroke="#334155" stroke-width="1"/>
  <rect x="205" y="295" width="80" height="60" fill="#1e3a5f" rx="2"/>
  <!-- cement bags icon in window -->
  <rect x="215" y="305" width="20" height="25" fill="#64748b" rx="2"/>
  <rect x="240" y="310" width="20" height="20" fill="#64748b" rx="2"/>
  <rect x="225" y="320" width="18" height="18" fill="#475569" rx="2"/>
  <text x="255" y="302" fill="#93c5fd" font-family="Arial" font-size="8">CEMENTO</text>

  <!-- Door -->
  <rect x="360" y="310" width="80" height="90" fill="#0f172a" rx="3" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="395" cy="360" r="4" fill="#60a5fa"/>

  <!-- Second window -->
  <rect x="510" y="290" width="90" height="100" fill="#0f172a" rx="4" stroke="#334155" stroke-width="1"/>
  <rect x="515" y="295" width="80" height="60" fill="#1e3a5f" rx="2"/>

  <!-- Street lamp -->
  <rect x="155" y="310" width="4" height="85" fill="#334155"/>
  <rect x="148" y="305" width="18" height="4" fill="#475569" rx="2"/>
  <ellipse cx="157" cy="305" rx="12" ry="6" fill="#fef08a" opacity="0.7" filter="url(#glow)"/>
  <!-- Lamp glow on ground -->
  <ellipse cx="157" cy="395" rx="40" ry="8" fill="#fef08a" opacity="0.1"/>

  <!-- Figure: Carlos standing outside with phone -->
  <!-- Body -->
  <circle cx="310" cy="330" r="16" fill="#fcd34d"/> <!-- head -->
  <rect x="295" y="346" width="30" height="40" fill="#dc2626" rx="4"/> <!-- shirt (red) -->
  <rect x="290" y="346" width="8" height="36" fill="#b91c1c" rx="2"/> <!-- left arm -->
  <rect x="312" y="346" width="13" height="36" fill="#b91c1c" rx="2"/> <!-- right arm bent -->
  <rect x="296" y="382" width="12" height="28" fill="#1e40af"/> <!-- left leg -->
  <rect x="310" y="382" width="12" height="28" fill="#1e40af"/> <!-- right leg -->
  <!-- Hard hat -->
  <ellipse cx="310" cy="318" rx="22" ry="10" fill="#f59e0b"/>
  <rect x="290" y="318" width="40" height="6" fill="#f59e0b" rx="1"/>
  <!-- Phone in hand -->
  <rect x="325" y="352" width="14" height="22" fill="#0f172a" rx="3" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="327" y="355" width="10" height="14" fill="#1d4ed8" rx="1"/>
  <!-- Notification glow from phone -->
  <ellipse cx="332" cy="353" rx="10" ry="6" fill="#3b82f6" opacity="0.3" filter="url(#glow)"/>

  <!-- WhatsApp notification bubble -->
  <rect x="345" y="320" width="160" height="60" fill="#064e3b" rx="12" filter="url(#softShadow)"/>
  <rect x="345" y="320" width="160" height="60" fill="none" stroke="#10b981" stroke-width="1.5" rx="12"/>
  <!-- WhatsApp icon -->
  <circle cx="365" cy="340" r="10" fill="#25D366"/>
  <text x="365" y="344" text-anchor="middle" fill="white" font-size="11" font-weight="bold">W</text>
  <text x="408" y="337" fill="#d1fae5" font-family="Arial" font-size="9" font-weight="bold">Pedido atrasado — día 3</text>
  <text x="380" y="352" fill="#6ee7b7" font-family="Arial" font-size="8">Cemento Argos · 4 órdenes</text>
  <text x="380" y="365" fill="#34d399" font-family="Arial" font-size="8" font-weight="bold">⚠ sin respuesta aún</text>

  <!-- Argos product stacks near door -->
  <rect x="450" y="355" width="25" height="22" fill="#94a3b8" rx="2"/>
  <rect x="455" y="345" width="25" height="22" fill="#64748b" rx="2"/>
  <text x="458" y="358" fill="#e2e8f0" font-family="Arial" font-size="7" font-weight="bold">ARGOS</text>
  <text x="460" y="368" fill="#cbd5e1" font-family="Arial" font-size="6">50kg</text>

  <!-- Label bottom -->
  <rect x="0" y="462" width="800" height="38" fill="#0f172a" opacity="0.85"/>
  <text x="30" y="484" fill="#60a5fa" font-family="Arial" font-size="11" font-weight="bold" letter-spacing="2">ESCENA 1</text>
  <text x="120" y="484" fill="#94a3b8" font-family="Arial" font-size="11">·  Carlos espera. 3 días. Ninguna respuesta del pedido.</text>
  <text x="650" y="484" fill="#4ade80" font-family="Arial" font-size="10" font-weight="bold">Antes de Salesforce</text>

  <!-- Pilar badge -->
  <rect x="680" y="20" width="105" height="24" fill="#1d4ed8" rx="12"/>
  <text x="733" y="36" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="9" font-weight="bold">PILAR 3 · INTEGRACIÓN</text>
</svg>
