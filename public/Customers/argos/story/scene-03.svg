<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="roadBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#e3f2fd"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="pingShadow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#roadBg)"/>

  <!-- Map background (aerial-like view) -->
  <rect x="0" y="0" width="800" height="500" fill="url(#mapGrad)" opacity="0.7"/>

  <!-- Streets / roads pattern -->
  <g fill="none" stroke="#cbd5e1" stroke-width="2">
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="340" x2="800" y2="340"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/>
  </g>
  <!-- Main road highlighted -->
  <rect x="0" y="175" width="800" height="10" fill="#bae6fd" opacity="0.8"/>
  <line x1="0" y1="180" x2="800" y2="180" stroke="white" stroke-width="1.5" stroke-dasharray="20,15"/>

  <!-- Blocks / city zones -->
  <rect x="20" y="30" width="110" height="130" fill="#d1fae5" rx="8" opacity="0.6"/>
  <rect x="170" y="30" width="200" height="130" fill="#fef9c3" rx="8" opacity="0.5"/>
  <rect x="420" y="30" width="190" height="130" fill="#fce7f3" rx="8" opacity="0.5"/>
  <rect x="20" y="200" width="110" height="120" fill="#e0e7ff" rx="8" opacity="0.6"/>
  <rect x="170" y="200" width="200" height="120" fill="#fef3c7" rx="8" opacity="0.5"/>
  <rect x="420" y="200" width="100" height="120" fill="#dcfce7" rx="8" opacity="0.5"/>
  <rect x="540" y="200" width="230" height="120" fill="#dbeafe" rx="8" opacity="0.5"/>

  <!-- Salesforce Maps Route line -->
  <path d="M130,420 C130,350 220,350 280,280 C340,210 400,180 460,175" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M460,175 C520,170 580,175 640,175 C680,175 710,200 730,230" stroke="#3b82f6" stroke-width="4" fill="none" stroke-dasharray="10,5" stroke-linecap="round"/>
  <!-- Route glow -->
  <path d="M130,420 C130,350 220,350 280,280 C340,210 400,180 460,175" stroke="#93c5fd" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round"/>

  <!-- Location Pins (clients to visit) -->
  <!-- Pin 1: Ferretería El Maestro (Carlos) - visited -->
  <g transform="translate(280, 240)" filter="url(#pingShadow)">
    <circle r="20" fill="#22c55e"/>
    <circle r="20" fill="none" stroke="#4ade80" stroke-width="3" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="13" font-weight="bold">✓</text>
    <rect x="-55" y="-48" width="110" height="28" fill="#0f172a" rx="8" opacity="0.9"/>
    <text x="0" y="-30" text-anchor="middle" fill="#4ade80" font-family="Arial" font-size="9" font-weight="bold">EL MAESTRO · Visitado</text>
    <text x="0" y="-19" text-anchor="middle" fill="#86efac" font-family="Arial" font-size="8">Score 92 · ↑ pedido sugerido</text>
    <polygon points="0,25 -6,15 6,15" fill="#22c55e"/>
  </g>

  <!-- Pin 2: Ferretería Los Andes (next stop) - RADAR alert -->
  <g transform="translate(462, 155)">
    <circle r="22" fill="#ef4444" filter="url(#glow3)"/>
    <circle r="30" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.5"/>
    <circle r="38" fill="none" stroke="#fca5a5" stroke-width="1.5" opacity="0.25"/>
    <text x="0" y="6" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">!</text>
    <rect x="-65" y="-50" width="130" height="32" fill="#7f1d1d" rx="8" opacity="0.95"/>
    <text x="0" y="-32" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="9" font-weight="bold">⚠ LOS ANDES · RIESGO FUGA</text>
    <text x="0" y="-22" text-anchor="middle" fill="#fecaca" font-family="Arial" font-size="8">Volumen ↓ 38% · 18 días sin comprar</text>
    <text x="0" y="-12" text-anchor="middle" fill="#fde68a" font-family="Arial" font-size="8" font-weight="bold">RADAR activo · Próxima visita</text>
    <polygon points="0,27 -7,17 7,17" fill="#ef4444"/>
  </g>

  <!-- Pin 3: Ferretería Constructora Paz (opportunity) -->
  <g transform="translate(650, 150)">
    <circle r="18" fill="#f59e0b"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">$</text>
    <rect x="-55" y="-44" width="110" height="26" fill="#0f172a" rx="8" opacity="0.9"/>
    <text x="0" y="-28" text-anchor="middle" fill="#fde68a" font-family="Arial" font-size="9" font-weight="bold">CONSTRUCTORA PAZ</text>
    <text x="0" y="-18" text-anchor="middle" fill="#fbbf24" font-family="Arial" font-size="8">Nueva obra detectada · Secop</text>
    <polygon points="0,22 -5,13 5,13" fill="#f59e0b"/>
  </g>

  <!-- Pin 4: home/start -->
  <g transform="translate(130, 390)">
    <circle r="14" fill="#6366f1"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="11">⊙</text>
    <rect x="-30" y="-38" width="60" height="20" fill="#312e81" rx="6" opacity="0.95"/>
    <text x="0" y="-25" text-anchor="middle" fill="#c7d2fe" font-family="Arial" font-size="8" font-weight="bold">Inicio ruta</text>
    <polygon points="0,18 -5,10 5,10" fill="#6366f1"/>
  </g>

  <!-- Salesforce Maps Car -->
  <g transform="translate(370, 185)">
    <!-- Car shadow -->
    <ellipse cx="0" cy="28" rx="42" ry="8" fill="#000" opacity="0.12"/>
    <!-- Car body -->
    <rect x="-38" y="0" width="76" height="32" fill="url(#carBody)" rx="8"/>
    <rect x="-28" y="-16" width="56" height="22" fill="#2563eb" rx="6"/>
    <!-- Windows -->
    <rect x="-24" y="-13" width="22" height="16" fill="#bfdbfe" rx="3" opacity="0.85"/>
    <rect x="2" y="-13" width="22" height="16" fill="#bfdbfe" rx="3" opacity="0.85"/>
    <!-- Wheels -->
    <circle cx="-26" cy="30" r="9" fill="#1e293b"/>
    <circle cx="-26" cy="30" r="5" fill="#475569"/>
    <circle cx="26" cy="30" r="9" fill="#1e293b"/>
    <circle cx="26" cy="30" r="5" fill="#475569"/>
    <!-- Argos logo on car -->
    <rect x="-12" y="8" width="24" height="12" fill="white" rx="3" opacity="0.9"/>
    <text x="0" y="18" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="8" font-weight="bold">ARGOS</text>
    <!-- GPS antenna glow -->
    <circle cx="0" cy="-22" r="5" fill="#22c55e" filter="url(#glow3)"/>
    <line x1="0" y1="-22" x2="0" y2="-17" stroke="#22c55e" stroke-width="2"/>
  </g>

  <!-- Mobile phone overlay (asesor phone in car) -->
  <rect x="30" y="230" width="100" height="175" fill="#0f172a" rx="14" filter="url(#shadow3)"/>
  <rect x="36" y="238" width="88" height="161" rx="10" fill="#111827"/>
  <rect x="40" y="246" width="80" height="148" rx="8" fill="#0f172a"/>
  <!-- Phone screen: maps app -->
  <rect x="40" y="246" width="80" height="148" rx="8" fill="#1e3a8a"/>
  <!-- Route on mini phone -->
  <path d="M50,360 C50,330 65,310 80,295 C85,285 90,275 100,270" stroke="#60a5fa" stroke-width="2.5" fill="none"/>
  <!-- Next stop highlight -->
  <circle cx="100" cy="270" r="8" fill="#ef4444"/>
  <circle cx="100" cy="270" r="12" fill="none" stroke="#fca5a5" stroke-width="1.5" opacity="0.6"/>
  <text x="80" y="265" fill="white" font-family="Arial" font-size="7" font-weight="bold">⚠</text>
  <!-- Phone header -->
  <rect x="40" y="246" width="80" height="22" fill="#1e40af" rx="8"/>
  <rect x="40" y="256" width="80" height="12" fill="#1e40af"/>
  <text x="80" y="263" text-anchor="middle" fill="white" font-family="Arial" font-size="8" font-weight="bold">SF Maps</text>

  <!-- Voice prompt bubble -->
  <rect x="48" y="380" width="74" height="30" fill="#064e3b" rx="8" stroke="#10b981" stroke-width="1"/>
  <text x="85" y="392" text-anchor="middle" fill="#6ee7b7" font-family="Arial" font-size="7">"Próxima parada:</text>
  <text x="85" y="403" text-anchor="middle" fill="#4ade80" font-family="Arial" font-size="7" font-weight="bold">Los Andes · 2.4km"</text>

  <!-- Right panel: Vista 360 card -->
  <rect x="530" y="285" width="248" height="185" fill="white" rx="16" filter="url(#shadow3)" stroke="#e0e7ff" stroke-width="1.5"/>
  <rect x="530" y="285" width="248" height="40" fill="#7c3aed" rx="16"/>
  <rect x="530" y="305" width="248" height="20" fill="#7c3aed"/>
  <text x="554" y="310" fill="white" font-family="Arial" font-size="11" font-weight="bold">Vista 360 · Ferretería Los Andes</text>

  <!-- KPIs in card -->
  <text x="548" y="342" fill="#64748b" font-family="Arial" font-size="9" font-weight="bold">RESUMEN CLIENTE</text>
  <!-- Metric rows -->
  <rect x="548" y="350" width="60" height="24" fill="#fef3c7" rx="6"/>
  <text x="578" y="360" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="8" font-weight="bold">38 días</text>
  <text x="578" y="370" text-anchor="middle" fill="#b45309" font-family="Arial" font-size="7">sin comprar</text>

  <rect x="618" y="350" width="60" height="24" fill="#fee2e2" rx="6"/>
  <text x="648" y="360" text-anchor="middle" fill="#991b1b" font-family="Arial" font-size="8" font-weight="bold">↓ -38%</text>
  <text x="648" y="370" text-anchor="middle" fill="#b91c1c" font-family="Arial" font-size="7">volumen</text>

  <rect x="688" y="350" width="70" height="24" fill="#dcfce7" rx="6"/>
  <text x="723" y="360" text-anchor="middle" fill="#15803d" font-family="Arial" font-size="8" font-weight="bold">Gris 50kg</text>
  <text x="723" y="370" text-anchor="middle" fill="#166534" font-family="Arial" font-size="7">producto clave</text>

  <!-- Einstein recommendation -->
  <rect x="548" y="384" width="220" height="40" fill="#f5f3ff" rx="10" stroke="#c4b5fd" stroke-width="1"/>
  <circle cx="566" cy="404" r="10" fill="#7c3aed" opacity="0.2"/>
  <circle cx="566" cy="404" r="7" fill="#7c3aed"/>
  <text x="566" y="408" text-anchor="middle" fill="white" font-family="Arial" font-size="9">★</text>
  <text x="580" y="398" fill="#5b21b6" font-family="Arial" font-size="9" font-weight="bold">Einstein recomienda:</text>
  <text x="580" y="411" fill="#6d28d9" font-family="Arial" font-size="8.5">Ofrecer Pack Fidelización + descuento 5%</text>
  <text x="580" y="422" fill="#7c3aed" font-family="Arial" font-size="8">Argos Amigos activo para este perfil</text>

  <!-- Action button in card -->
  <rect x="548" y="435" width="105" height="22" fill="#7c3aed" rx="11"/>
  <text x="600" y="449" text-anchor="middle" fill="white" font-family="Arial" font-size="9" font-weight="bold">Llamar ahora →</text>
  <rect x="662" y="435" width="105" height="22" fill="#ddd6fe" rx="11"/>
  <text x="715" y="449" text-anchor="middle" fill="#5b21b6" font-family="Arial" font-size="9" font-weight="bold">Enviar oferta</text>

  <!-- Label -->
  <rect x="0" y="462" width="800" height="38" fill="#1e3a8a" opacity="0.9"/>
  <text x="30" y="484" fill="#60a5fa" font-family="Arial" font-size="11" font-weight="bold" letter-spacing="2">ESCENA 3</text>
  <text x="120" y="484" fill="#bfdbfe" font-family="Arial" font-size="11">·  El asesor llega preparado. Salesforce Maps + RADAR + Vista 360 antes de cada visita.</text>
  <text x="620" y="484" fill="#a78bfa" font-family="Arial" font-size="10" font-weight="bold">PILAR 1 · Market Share</text>
</svg>
