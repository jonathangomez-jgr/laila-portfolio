<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.25"/>
    </filter>
    <filter id="softDrop">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- Grid lines (data feel) -->
  <g stroke="#bfdbfe" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#1e3a8a" font-family="Arial" font-size="13" font-weight="bold" letter-spacing="3">ARGOS ONE — PORTAL DIGITAL</text>
  <line x1="200" y1="50" x2="600" y2="50" stroke="#3b82f6" stroke-width="1.5" opacity="0.5"/>

  <!-- Large phone mockup center -->
  <rect x="285" y="65" width="230" height="390" rx="24" fill="url(#phoneBody)" filter="url(#cardShadow)"/>
  <rect x="291" y="71" width="218" height="378" rx="20" fill="#0f172a"/>
  <!-- Screen -->
  <rect x="295" y="82" width="210" height="356" rx="16" fill="url(#screenBg)"/>
  <!-- Notch -->
  <rect x="370" y="83" width="60" height="16" rx="8" fill="#0f172a"/>

  <!-- App header in phone -->
  <rect x="295" y="82" width="210" height="40" fill="#1e40af" rx="0"/>
  <rect x="295" y="82" width="210" height="40" rx="16" fill="#1e40af"/>
  <rect x="295" y="100" width="210" height="22" fill="#1e40af"/>
  <!-- Argos ONE logo in app -->
  <circle cx="320" cy="102" r="12" fill="#ef4444"/>
  <text x="320" y="107" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="900">A</text>
  <text x="345" y="107" fill="white" font-family="Arial" font-size="11" font-weight="bold">Argos ONE</text>

  <!-- Status bar: order tracking -->
  <rect x="305" y="132" width="190" height="70" fill="#1e3a8a" rx="10"/>
  <text x="315" y="148" fill="#93c5fd" font-family="Arial" font-size="8" font-weight="bold">PEDIDO #ARG-2026-4471</text>
  <text x="315" y="163" fill="#bfdbfe" font-family="Arial" font-size="9">Cemento Argos Gris 50kg × 40</text>
  <!-- Progress bar -->
  <rect x="315" y="172" width="170" height="6" rx="3" fill="#1e40af"/>
  <rect x="315" y="172" width="120" height="6" rx="3" fill="#22c55e"/>
  <!-- Status dots -->
  <circle cx="315" cy="190" r="5" fill="#22c55e"/>
  <text x="325" y="194" fill="#86efac" font-family="Arial" font-size="8">Despachado</text>
  <circle cx="375" cy="190" r="5" fill="#f59e0b"/>
  <text x="385" y="194" fill="#fde68a" font-family="Arial" font-size="8">En camino</text>

  <!-- Agent interaction card -->
  <rect x="305" y="215" width="190" height="90" fill="#0f172a" rx="10" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Robot/agent icon -->
  <circle cx="328" cy="237" r="13" fill="#3b82f6" opacity="0.2"/>
  <circle cx="328" cy="237" r="10" fill="#1d4ed8"/>
  <!-- Bot face -->
  <circle cx="323" cy="234" r="2.5" fill="#93c5fd"/>
  <circle cx="333" cy="234" r="2.5" fill="#93c5fd"/>
  <path d="M323 241 Q328 245 333 241" stroke="#93c5fd" stroke-width="1.5" fill="none"/>
  <rect x="325" y="227" width="6" height="4" fill="#60a5fa" rx="1"/>

  <text x="345" y="232" fill="#93c5fd" font-family="Arial" font-size="8" font-weight="bold">Agente Argos</text>
  <text x="315" y="250" fill="#e2e8f0" font-family="Arial" font-size="8.5">Hola Carlos, tu pedido</text>
  <text x="315" y="263" fill="#e2e8f0" font-family="Arial" font-size="8.5">llega mañana 8am.</text>
  <text x="315" y="276" fill="#4ade80" font-family="Arial" font-size="8" font-weight="bold">¿Confirmas la recepción?</text>
  <!-- Reply buttons -->
  <rect x="315" y="282" width="70" height="16" fill="#16a34a" rx="8"/>
  <text x="350" y="293" text-anchor="middle" fill="white" font-family="Arial" font-size="8" font-weight="bold">Confirmar ✓</text>
  <rect x="392" y="282" width="95" height="16" fill="#1e40af" rx="8"/>
  <text x="440" y="293" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="8">Ver detalles →</text>

  <!-- Order history -->
  <rect x="305" y="316" width="190" height="55" fill="#0f172a" rx="8"/>
  <text x="315" y="330" fill="#94a3b8" font-family="Arial" font-size="8">HISTORIAL RECIENTE</text>
  <rect x="315" y="336" width="60" height="6" rx="3" fill="#22c55e" opacity="0.7"/>
  <text x="382" y="342" fill="#86efac" font-family="Arial" font-size="8">✓ Entregado Feb</text>
  <rect x="315" y="348" width="40" height="6" rx="3" fill="#f59e0b" opacity="0.7"/>
  <text x="362" y="354" fill="#fde68a" font-family="Arial" font-size="8">· En camino Mar</text>
  <rect x="315" y="360" width="80" height="6" rx="3" fill="#3b82f6" opacity="0.7"/>
  <text x="402" y="366" fill="#93c5fd" font-family="Arial" font-size="8">○ Activo Abr</text>

  <!-- Bottom action -->
  <rect x="310" y="382" width="180" height="44" fill="#2563eb" rx="12"/>
  <text x="400" y="402" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">Nuevo Pedido</text>
  <text x="400" y="416" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="9">→ Argos ONE conectado al CRM</text>

  <!-- Left side: Data flow visual -->
  <!-- Cloud / Salesforce node -->
  <rect x="30" y="160" width="175" height="80" fill="white" rx="16" filter="url(#softDrop)" stroke="#e0e7ff" stroke-width="1.5"/>
  <circle cx="62" cy="195" r="18" fill="#4f46e5" opacity="0.15"/>
  <circle cx="62" cy="195" r="14" fill="#4338ca"/>
  <text x="62" y="200" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">SF</text>
  <text x="88" y="188" fill="#1e3a8a" font-family="Arial" font-size="11" font-weight="bold">Salesforce CRM</text>
  <text x="88" y="203" fill="#4f46e5" font-family="Arial" font-size="9">Vista 360 actualizada</text>
  <text x="88" y="217" fill="#6366f1" font-family="Arial" font-size="9">en tiempo real</text>

  <!-- MuleSoft connector arrow -->
  <line x1="205" y1="200" x2="280" y2="280" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="277,285 285,275 275,273" fill="#3b82f6"/>
  <rect x="210" y="218" width="58" height="18" fill="#dbeafe" rx="9"/>
  <text x="239" y="230" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="8" font-weight="bold">MuleSoft API</text>

  <!-- SAP node -->
  <rect x="30" y="285" width="175" height="70" fill="white" rx="16" filter="url(#softDrop)" stroke="#e0e7ff" stroke-width="1.5"/>
  <rect x="50" y="302" width="30" height="20" fill="#005B99" rx="3"/>
  <text x="65" y="316" text-anchor="middle" fill="white" font-family="Arial" font-size="9" font-weight="bold">SAP</text>
  <text x="90" y="313" fill="#1e3a8a" font-family="Arial" font-size="10" font-weight="bold">Inventario real</text>
  <text x="90" y="328" fill="#64748b" font-family="Arial" font-size="9">Crédito disponible</text>
  <text x="90" y="343" fill="#64748b" font-family="Arial" font-size="9">Capacidad planta</text>

  <!-- Connecting dots between left cards -->
  <line x1="117" y1="240" x2="117" y2="285" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Right side: Asesor commercial dashboard -->
  <rect x="525" y="140" width="240" height="200" fill="white" rx="16" filter="url(#softDrop)" stroke="#e0e7ff" stroke-width="1.5"/>
  <rect x="525" y="140" width="240" height="36" fill="#1e40af" rx="16"/>
  <rect x="525" y="160" width="240" height="16" fill="#1e40af"/>
  <text x="545" y="163" fill="white" font-family="Arial" font-size="11" font-weight="bold">Dashboard Asesor · Zona Norte</text>

  <!-- Mini chart -->
  <text x="540" y="196" fill="#1e3a8a" font-family="Arial" font-size="9" font-weight="bold">ACTIVIDAD CARLOS FERRETERÍA EL MAESTRO</text>
  <!-- Bar chart -->
  <rect x="545" y="240" width="16" height="45" fill="#bfdbfe" rx="2"/>
  <rect x="568" y="220" width="16" height="65" fill="#93c5fd" rx="2"/>
  <rect x="591" y="230" width="16" height="55" fill="#60a5fa" rx="2"/>
  <rect x="614" y="210" width="16" height="75" fill="#3b82f6" rx="2"/>
  <rect x="637" y="200" width="16" height="85" fill="#1d4ed8" rx="2"/>
  <text x="553" y="295" fill="#94a3b8" font-family="Arial" font-size="7">Nov</text>
  <text x="576" y="295" fill="#94a3b8" font-family="Arial" font-size="7">Dic</text>
  <text x="598" y="295" fill="#94a3b8" font-family="Arial" font-size="7">Ene</text>
  <text x="620" y="295" fill="#94a3b8" font-family="Arial" font-size="7">Feb</text>
  <text x="643" y="295" fill="#4ade80" font-family="Arial" font-size="7" font-weight="bold">Mar ↑</text>

  <!-- Tags in asesor card -->
  <rect x="540" y="305" width="80" height="16" fill="#dcfce7" rx="8"/>
  <text x="580" y="316" text-anchor="middle" fill="#16a34a" font-family="Arial" font-size="8" font-weight="bold">↑ 23% vs mes ant.</text>
  <rect x="628" y="305" width="75" height="16" fill="#dbeafe" rx="8"/>
  <text x="666" y="316" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="8" font-weight="bold">Argos ONE activo</text>
  <text x="540" y="330" fill="#64748b" font-family="Arial" font-size="8">Última visita: hace 4 días · Score: Alto</text>

  <!-- Arrow from phone to asesor -->
  <line x1="515" y1="280" x2="525" y2="240" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="523,244 527,234 519,238" fill="#3b82f6"/>
  <rect x="500" y="258" width="55" height="16" fill="#dbeafe" rx="8"/>
  <text x="528" y="269" text-anchor="middle" fill="#1d4ed8" font-family="Arial" font-size="7.5" font-weight="bold">Sync real-time</text>

  <!-- Bottom notification card right -->
  <rect x="525" y="360" width="240" height="80" fill="#f0fdf4" rx="16" stroke="#bbf7d0" stroke-width="1.5" filter="url(#softDrop)"/>
  <circle cx="553" cy="393" r="16" fill="#16a34a" opacity="0.15"/>
  <circle cx="553" cy="393" r="12" fill="#16a34a"/>
  <text x="553" y="398" text-anchor="middle" fill="white" font-family="Arial" font-size="12">✓</text>
  <text x="575" y="385" fill="#15803d" font-family="Arial" font-size="10" font-weight="bold">Pedido ARG-4471 confirmado</text>
  <text x="575" y="400" fill="#4ade80" font-family="Arial" font-size="9">Visibilidad completa en CRM</text>
  <text x="575" y="414" fill="#64748b" font-family="Arial" font-size="9">Asesor notificado · SAP actualizado</text>
  <text x="575" y="428" fill="#22c55e" font-family="Arial" font-size="9" font-weight="bold">SLA: 0 escalamientos</text>

  <!-- Label -->
  <rect x="0" y="462" width="800" height="38" fill="#1e3a8a" opacity="0.9"/>
  <text x="30" y="484" fill="#60a5fa" font-family="Arial" font-size="11" font-weight="bold" letter-spacing="2">ESCENA 2</text>
  <text x="120" y="484" fill="#bfdbfe" font-family="Arial" font-size="11">·  Argos ONE, SAP y CRM hablan en tiempo real. Carlos lo ve en su celular.</text>
  <text x="630" y="484" fill="#4ade80" font-family="Arial" font-size="10" font-weight="bold">PILAR 3 · Integración</text>
</svg>
