<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="officeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="dashGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="barViolet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="screenGlow5">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#3b82f6" flood-opacity="0.2"/>
    </filter>
    <filter id="softDrop5">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Office background -->
  <rect width="800" height="500" fill="url(#officeBg)"/>
  <!-- Office window light -->
  <rect x="600" y="0" width="200" height="200" fill="#fef9c3" opacity="0.15"/>
  <rect x="605" y="5" width="85" height="140" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="700" y="5" width="85" height="140" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <!-- Floor line -->
  <rect x="0" y="450" width="800" height="50" fill="#e2e8f0"/>
  <rect x="0" y="448" width="800" height="3" fill="#cbd5e1"/>

  <!-- Big monitor/dashboard on wall -->
  <rect x="30" y="55" width="480" height="290" rx="12" fill="#0f172a" filter="url(#screenGlow5)"/>
  <rect x="30" y="55" width="480" height="290" rx="12" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Monitor stand -->
  <rect x="245" y="345" width="50" height="18" fill="#334155"/>
  <rect x="220" y="360" width="100" height="8" fill="#475569" rx="4"/>

  <!-- Dashboard content -->
  <rect x="38" y="63" width="464" height="274" rx="8" fill="url(#dashGrad)"/>

  <!-- Dashboard header -->
  <rect x="38" y="63" width="464" height="34" fill="#1e293b" rx="8"/>
  <rect x="38" y="85" width="464" height="12" fill="#1e293b"/>
  <circle cx="58" cy="80" r="6" fill="#4f46e5"/>
  <text x="72" y="84" fill="white" font-family="Arial" font-size="10" font-weight="bold">Salesforce Analytics · Dirección Comercial</text>
  <text x="400" y="84" fill="#64748b" font-family="Arial" font-size="9">Mayo 2026 · Tiempo real</text>
  <!-- green live dot -->
  <circle cx="440" cy="80" r="4" fill="#22c55e"/>
  <text x="448" y="84" fill="#4ade80" font-family="Arial" font-size="9" font-weight="bold">EN VIVO</text>

  <!-- KPI row -->
  <rect x="46" y="103" width="98" height="55" fill="#1e3a8a" rx="8"/>
  <text x="95" y="120" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="8" font-weight="bold">MARKET SHARE</text>
  <text x="95" y="142" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="900">13.2%</text>
  <text x="95" y="152" text-anchor="middle" fill="#4ade80" font-family="Arial" font-size="9">↑ +2.2pp vs ene</text>

  <rect x="152" y="103" width="98" height="55" fill="#064e3b" rx="8"/>
  <text x="201" y="120" text-anchor="middle" fill="#6ee7b7" font-family="Arial" font-size="8" font-weight="bold">PIPELINE ACTIVO</text>
  <text x="201" y="142" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="900">$4.8B</text>
  <text x="201" y="152" text-anchor="middle" fill="#4ade80" font-family="Arial" font-size="9">COP · 340 oport.</text>

  <rect x="258" y="103" width="98" height="55" fill="#1e1b4b" rx="8"/>
  <text x="307" y="120" text-anchor="middle" fill="#c7d2fe" font-family="Arial" font-size="8" font-weight="bold">CLIENTES RIESGO</text>
  <text x="307" y="142" text-anchor="middle" fill="#f87171" font-family="Arial" font-size="20" font-weight="900">12</text>
  <text x="307" y="152" text-anchor="middle" fill="#fca5a5" font-family="Arial" font-size="9">↓ desde 38 (RADAR)</text>

  <rect x="364" y="103" width="130" height="55" fill="#1c1917" rx="8"/>
  <text x="429" y="120" text-anchor="middle" fill="#fcd34d" font-family="Arial" font-size="8" font-weight="bold">CONVERSIÓN CANAL MASIVO</text>
  <text x="429" y="142" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="900">68%</text>
  <text x="429" y="152" text-anchor="middle" fill="#4ade80" font-family="Arial" font-size="9">↑ +18pp vs Q1</text>

  <!-- Bar chart: Ventas por zona -->
  <text x="48" y="175" fill="#94a3b8" font-family="Arial" font-size="9" font-weight="bold" letter-spacing="1">VENTAS POR ZONA — Canal Masivo</text>
  <!-- Bars -->
  <rect x="55" y="215" width="28" height="50" fill="url(#barBlue)" rx="3"/>
  <rect x="90" y="205" width="28" height="60" fill="url(#barBlue)" rx="3"/>
  <rect x="125" y="198" width="28" height="67" fill="url(#barGreen)" rx="3"/>
  <rect x="160" y="190" width="28" height="75" fill="url(#barGreen)" rx="3"/>
  <rect x="195" y="182" width="28" height="83" fill="url(#barViolet)" rx="3"/>
  <!-- Labels -->
  <text x="69" y="275" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="8">Norte</text>
  <text x="104" y="275" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="8">Sur</text>
  <text x="139" y="275" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="8">Centro</text>
  <text x="174" y="275" text-anchor="middle" fill="#64748b" font-family="Arial" font-size="8">Oriente</text>
  <text x="209" y="275" text-anchor="middle" fill="#a78bfa" font-family="Arial" font-size="8">Antioquia</text>
  <text x="209" y="178" text-anchor="middle" fill="#4ade80" font-family="Arial" font-size="9" font-weight="bold">↑+15%</text>

  <!-- Line chart: Pipeline trend -->
  <text x="260" y="175" fill="#94a3b8" font-family="Arial" font-size="9" font-weight="bold" letter-spacing="1">PIPELINE TREND — Oportunidades automáticas</text>
  <path d="M262,265 L295,258 L328,248 L361,236 L394,222 L427,208 L460,195" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M262,265 L295,258 L328,248 L361,236 L394,222 L427,208 L460,195 L460,275 L262,275 Z" fill="#3b82f6" opacity="0.12"/>
  <!-- Data points -->
  <circle cx="262" cy="265" r="4" fill="#60a5fa"/>
  <circle cx="295" cy="258" r="4" fill="#60a5fa"/>
  <circle cx="328" cy="248" r="4" fill="#60a5fa"/>
  <circle cx="361" cy="236" r="4" fill="#60a5fa"/>
  <circle cx="394" cy="222" r="5" fill="#3b82f6"/>
  <circle cx="427" cy="208" r="5" fill="#3b82f6"/>
  <circle cx="460" cy="195" r="6" fill="#22c55e" filter="url(#softDrop5)"/>
  <!-- Labels -->
  <text x="262" y="284" fill="#64748b" font-family="Arial" font-size="7">Nov</text>
  <text x="295" y="284" fill="#64748b" font-family="Arial" font-size="7">Dic</text>
  <text x="328" y="284" fill="#64748b" font-family="Arial" font-size="7">Ene</text>
  <text x="361" y="284" fill="#64748b" font-family="Arial" font-size="7">Feb</text>
  <text x="394" y="284" fill="#64748b" font-family="Arial" font-size="7">Mar</text>
  <text x="427" y="284" fill="#64748b" font-family="Arial" font-size="7">Abr</text>
  <text x="454" y="284" fill="#4ade80" font-family="Arial" font-size="7" font-weight="bold">May ↑</text>

  <!-- Bottom bar: Agentes activos -->
  <rect x="38" y="285" width="464" height="44" fill="#0f172a" rx="8"/>
  <text x="55" y="303" fill="#94a3b8" font-family="Arial" font-size="9" font-weight="bold">AGENTES ACTIVOS AHORA</text>
  <!-- Agent badges -->
  <rect x="55" y="309" width="80" height="14" fill="#1e3a8a" rx="7"/>
  <circle cx="67" cy="316" r="4" fill="#22c55e"/>
  <text x="75" y="320" fill="#93c5fd" font-family="Arial" font-size="8" font-weight="bold">SDR · 14 oport.</text>

  <rect x="143" y="309" width="90" height="14" fill="#064e3b" rx="7"/>
  <circle cx="155" cy="316" r="4" fill="#22c55e"/>
  <text x="163" y="320" fill="#6ee7b7" font-family="Arial" font-size="8" font-weight="bold">WhatsApp · 47 PQR</text>

  <rect x="241" y="309" width="85" height="14" fill="#1e1b4b" rx="7"/>
  <circle cx="253" cy="316" r="4" fill="#22c55e"/>
  <text x="261" y="320" fill="#c7d2fe" font-family="Arial" font-size="8" font-weight="bold">Machine Sellers</text>

  <rect x="334" y="309" width="80" height="14" fill="#2d1d09" rx="7"/>
  <circle cx="346" cy="316" r="4" fill="#22c55e"/>
  <text x="354" y="320" fill="#fcd34d" font-family="Arial" font-size="8" font-weight="bold">RADAR · 12 alerts</text>

  <!-- Director figure -->
  <g transform="translate(565, 200)">
    <!-- Shadow -->
    <ellipse cx="0" cy="130" rx="30" ry="8" fill="#000" opacity="0.1"/>
    <!-- Body -->
    <rect x="-22" y="60" width="44" height="55" fill="#1e40af" rx="6"/>
    <!-- Tie -->
    <polygon points="0,62 -5,72 0,100 5,72" fill="#1e3a8a"/>
    <!-- Head -->
    <circle cx="0" cy="48" r="20" fill="#fde68a"/>
    <!-- Hair -->
    <rect x="-20" y="30" width="40" height="12" fill="#713f12" rx="8"/>
    <!-- Glasses -->
    <circle cx="-8" cy="47" r="5" fill="none" stroke="#374151" stroke-width="1.5"/>
    <circle cx="8" cy="47" r="5" fill="none" stroke="#374151" stroke-width="1.5"/>
    <line x1="-3" y1="47" x2="3" y2="47" stroke="#374151" stroke-width="1"/>
    <!-- Arms - pointing at screen -->
    <line x1="-22" y1="75" x2="-50" y2="65" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <line x1="22" y1="75" x2="35" y2="90" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <!-- Legs -->
    <rect x="-18" y="110" width="14" height="30" fill="#374151" rx="4"/>
    <rect x="5" y="110" width="14" height="30" fill="#374151" rx="4"/>
    <!-- Shoes -->
    <rect x="-20" y="136" width="18" height="8" fill="#111827" rx="3"/>
    <rect x="3" y="136" width="18" height="8" fill="#111827" rx="3"/>
    <!-- Speech bubble -->
    <rect x="-55" y="-35" width="155" height="60" fill="#1e40af" rx="12" filter="url(#softDrop5)"/>
    <polygon points="0,-5 -8,-15 8,-15" fill="#1e40af" transform="translate(0, -5)"/>
    <text x="22" y="-15" text-anchor="middle" fill="#bfdbfe" font-family="Arial" font-size="8.5">¡Zona Antioquia subió</text>
    <text x="22" y="0" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">+15% este mes!</text>
    <text x="22" y="14" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="8">SPRINT 4.0 en track</text>
  </g>

  <!-- Right: Notification stack -->
  <g transform="translate(640, 80)">
    <rect width="150" height="50" fill="white" rx="10" filter="url(#softDrop5)" stroke="#e0f2fe" stroke-width="1"/>
    <circle cx="20" cy="25" r="12" fill="#dbeafe"/>
    <text x="20" y="30" text-anchor="middle" fill="#1d4ed8" font-size="14">📊</text>
    <text x="40" y="18" fill="#1e3a8a" font-family="Arial" font-size="8.5" font-weight="bold">Oport. automáticas</text>
    <text x="40" y="30" fill="#3b82f6" font-family="Arial" font-size="9" font-weight="bold">+14 hoy · SDR</text>
    <text x="40" y="42" fill="#64748b" font-family="Arial" font-size="7">Galería + Secop</text>
  </g>

  <g transform="translate(640, 140)">
    <rect width="150" height="50" fill="white" rx="10" filter="url(#softDrop5)" stroke="#dcfce7" stroke-width="1"/>
    <circle cx="20" cy="25" r="12" fill="#dcfce7"/>
    <text x="20" y="30" text-anchor="middle" fill="#16a34a" font-size="14">🎯</text>
    <text x="40" y="18" fill="#15803d" font-family="Arial" font-size="8.5" font-weight="bold">Conversión masivo</text>
    <text x="40" y="30" fill="#22c55e" font-family="Arial" font-size="9" font-weight="bold">68% · ↑ +18pp</text>
    <text x="40" y="42" fill="#64748b" font-family="Arial" font-size="7">Cierre automático</text>
  </g>

  <g transform="translate(640, 200)">
    <rect width="150" height="50" fill="white" rx="10" filter="url(#softDrop5)" stroke="#fde68a" stroke-width="1"/>
    <circle cx="20" cy="25" r="12" fill="#fef9c3"/>
    <text x="20" y="30" text-anchor="middle" fill="#d97706" font-size="14">⚡</text>
    <text x="40" y="18" fill="#92400e" font-family="Arial" font-size="8.5" font-weight="bold">RADAR ejecutado</text>
    <text x="40" y="30" fill="#b45309" font-family="Arial" font-size="9" font-weight="bold">12 clientes activos</text>
    <text x="40" y="42" fill="#64748b" font-family="Arial" font-size="7">Desde 38 · -68%</text>
  </g>

  <!-- Label -->
  <rect x="0" y="462" width="800" height="38" fill="#0f172a" opacity="0.9"/>
  <text x="30" y="484" fill="#60a5fa" font-family="Arial" font-size="11" font-weight="bold" letter-spacing="2">ESCENA 5</text>
  <text x="120" y="484" fill="#94a3b8" font-family="Arial" font-size="11">·  La dirección ve el pipeline en tiempo real. SPRINT 4.0 en track. Sin rezago Excel.</text>
  <text x="610" y="484" fill="#60a5fa" font-family="Arial" font-size="10" font-weight="bold">PILAR 1 · Market Share</text>
</svg>
